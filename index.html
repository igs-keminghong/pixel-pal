<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素行程夥伴</title>
<meta name="description" content="像素風行程助手：吉祥物每晚提醒你明天的行程，還能和好友互傳訊息。">
<meta name="theme-color" content="#7A4424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行程夥伴">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;background:#3A2A1E}
body{margin:0;overscroll-behavior:none}
img{max-width:100%}
/* Layout: full-screen illustrated scene; hanging wooden sign on top, mascot standing on the grass,
   framed parchment panels and a wooden tab bar built from the cut UI-kit images (border-image 9-slice).
   Single fixed visual world (cozy daylight wood + parchment), so no dark variant. */
:root{
  --ink:#5A3322; --muted:#8C6A4F; --cream:#FFF3DC; --pill:#FCEBCB; --pillb:#E4C08A; --field:#FFF8EA; --fieldb:#C99A63;
  --gold:#F4B63E; --red:#E2483B; --shade:#4A2614; --scene:#5DB0EA;
  --f-pixel:"DotGothic16","Noto Sans TC",ui-monospace,monospace;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#3A2A1E;color:var(--ink);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img{-webkit-user-drag:none}

.app{max-width:480px;margin:0 auto;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:var(--scene) var(--bg,url(assets/bg_day.webp)) center top/cover no-repeat;transition:background-image .4s;image-rendering:pixelated}
.app::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(60,30,12,.22),rgba(60,30,12,.38));opacity:0;transition:opacity .3s;pointer-events:none}
.app:not([data-tab="home"])::before{opacity:1}
.app>header,.app>main,.app>nav{position:relative}
.app img{image-rendering:auto}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* ---------- art pieces ---------- */
.frame{border:26px solid transparent;border-image:url(assets/frame.png) 72 fill / 26px stretch}
.card{border:14px solid transparent;border-image:url(assets/card.png) 40 fill / 14px stretch}
.wood{border:12px solid transparent;border-image:url(assets/btn_wood.png) 40 fill / 12px stretch;color:var(--cream);text-shadow:0 2px 0 var(--shade)}
.gold{border:12px solid transparent;border-image:url(assets/btn_gold.png) 40 fill / 12px stretch;color:#5A2E10;text-shadow:0 1px 0 rgba(255,240,200,.7)}
.plank{border:18px solid transparent;border-image:url(assets/plank.png) 60 fill / 18px stretch}
.btn{font-family:var(--f-pixel);font-size:15px;padding:0 10px;min-height:22px;line-height:22px;background:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(2px)}
.btn img{height:20px;width:auto}
.ic{width:auto;display:block}

/* ---------- header sign ---------- */
header.top{display:flex;justify-content:center;padding-top:0;flex:0 0 auto}
.sign{width:min(100%,400px);aspect-ratio:514/198;background:url(assets/sign.png) center/100% 100% no-repeat;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:16% 14% 8%;margin-top:-4px}
.sign .ic{height:clamp(32px,10vw,42px)}
.sign .d{font-family:var(--f-pixel);color:var(--cream);text-shadow:0 2px 0 var(--shade);font-size:clamp(14px,4.3vw,20px);line-height:1.15;min-width:0;white-space:nowrap}
.sign .d small{display:block;font-size:12px;opacity:.9;letter-spacing:.04em}
.streak{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--shade);border-radius:12px;padding:2px 8px 2px 4px;font-family:var(--f-pixel);font-size:13px;color:var(--ink)}
.streak img{height:20px}

main{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;min-height:0}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 16px;min-height:100%}
#v-home{gap:0;padding-bottom:10px}

/* ---------- stage ---------- */
.stage{position:relative;flex:1 1 auto;min-height:190px}
.pet{position:absolute;left:47%;bottom:6px;transform:translateX(-50%);border:0;background:none;padding:0;display:flex;align-items:flex-end;justify-content:center}
.pet::before{content:"";position:absolute;left:14%;right:14%;bottom:-5px;height:14px;border-radius:50%;background:rgba(28,52,12,.38);box-shadow:0 0 0 4px rgba(28,52,12,.14)}
.pet img{position:relative;display:block;height:auto}
.pet img{transform-origin:50% 100%}
.pet.bob img{transform:scale(1.015,.97)}
.pet.jump img{animation:jump .7s steps(5) 1}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px)}65%{transform:translateY(-10px)}}
.bubble{position:absolute;bottom:60%;left:50%;width:max-content;max-width:min(240px,calc(100% - 12px));border:17px solid transparent;
  border-image:url(assets/bubble_body.png) 60 fill / 17px stretch;
  padding:0 6px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.bubble{text-align:center}
.bubble .tail{position:absolute;top:calc(100% + 8px);left:20px;width:23px;height:auto;pointer-events:none}
.bubble b{font-family:var(--f-pixel);font-weight:400;color:#A6431C;font-size:13px;margin-right:5px}
.float-heart{position:absolute;width:26px;pointer-events:none;animation:floaty 1.2s steps(6) forwards}
@keyframes floaty{to{transform:translateY(-80px);opacity:0}}

/* ---------- panels ---------- */
.panel{position:relative;margin-top:22px}
.panel .inner{display:flex;flex-direction:column;gap:8px;padding-top:18px}
.plaque{position:absolute;left:50%;top:-40px;transform:translateX(-50%);z-index:2;padding:0 14px;min-height:24px;font-size:15px}
.plaque img{height:22px}
.row{display:grid;grid-template-columns:22px 46px 3px 28px 1fr;align-items:center;gap:8px;padding:6px 10px;background:var(--pill);border:3px solid var(--pillb);border-radius:14px;min-width:0}
.row .ck{height:20px}
.row .t{font-family:var(--f-pixel);font-variant-numeric:tabular-nums;font-size:15px}
.row .sep{align-self:stretch;background:var(--pillb);border-radius:2px}
.row .cat{height:24px;max-width:28px;object-fit:contain;justify-self:center}
.row .ti{min-width:0}
.row .ti strong{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .ti strong{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.75}
.empty{color:var(--muted);font-size:14px;margin:4px 2px}
.chk{width:24px;height:24px;border:3px solid var(--shade);background:var(--field);border-radius:6px;padding:0}
.chk[aria-checked="true"]{background:var(--gold) url(assets/star.png) center/16px no-repeat}
.row.sch{grid-template-columns:24px 46px 3px 28px 1fr}
h2{font-family:var(--f-pixel);font-weight:400;font-size:17px;margin:0;color:var(--ink)}
.on-scene{color:var(--cream);text-shadow:0 2px 0 var(--shade),0 0 6px rgba(0,0,0,.35)}
.seg{display:flex;gap:8px}
.seg .btn{flex:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:12.5px;color:var(--muted);margin:0}
.src{font-size:12px;color:var(--muted)}

/* ---------- friends ---------- */
.mycode{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mycode .code{font-family:var(--f-pixel);font-size:22px;letter-spacing:.08em}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.field-in{border:3px solid var(--fieldb);background:var(--field);border-radius:10px;padding:7px 10px;min-width:0;width:100%}
.addf{display:flex;gap:8px;margin-top:10px}
.addf input{flex:1}
.fr{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--pill);border:3px solid var(--pillb);border-radius:14px;padding:6px 10px}
.av{width:52px;height:52px;border-radius:50%;background:#CFE8F5;border:3px solid var(--shade);display:grid;place-items:end center;overflow:hidden}
.av img{width:84%;height:auto;margin-bottom:-2px}
.fr .meta{min-width:0}
.fr .meta strong{display:flex;align-items:center;gap:6px;font-weight:500}
.fr .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{min-width:22px;height:20px;padding:0 4px;background:url(assets/badge.png) center/100% 100% no-repeat;color:#fff;font-family:var(--f-pixel);font-size:12px;display:inline-grid;place-items:center}

/* ---------- settings ---------- */
.pets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{position:relative;background:var(--pill);border:3px solid var(--pillb);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick img.p{height:68px;width:auto;object-fit:contain}
.pick span{font-family:var(--f-pixel);font-size:14px}
.pick[aria-checked="true"]{background:#FFE3A0;border-color:#D89A2C}
.pick[aria-checked="true"]::after{content:"";position:absolute;right:-6px;top:-8px;width:26px;height:26px;background:url(assets/star.png) center/contain no-repeat}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.conn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.conn p{margin:0;font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--f-pixel);font-size:12px;padding:1px 8px;border:2px solid var(--pillb);border-radius:8px;color:var(--muted);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- tab bar ---------- */
nav.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 6px 4px;padding-block:0}
nav.tabs button{background:none;padding:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--f-pixel);font-size:11px;position:relative}
nav.tabs button img{height:28px;width:auto}
nav.tabs .badge{position:absolute;top:-12px;right:-10px;width:22px;height:16px;background:url(assets/badge.png) center/100% 100% no-repeat}

/* ---------- chat ---------- */
.chat{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(rgba(60,30,12,.3),rgba(60,30,12,.45)),var(--scene) url(assets/bg_chat.webp) center/cover no-repeat;image-rendering:pixelated}
.chat-h{display:flex;align-items:center;gap:10px;margin:6px 6px 0}
.chat-h .who{flex:1;min-width:0;color:var(--cream);text-shadow:0 2px 0 var(--shade)}
.chat-h .who strong{display:block;font-family:var(--f-pixel);font-weight:400;font-size:17px;line-height:1.2}
.chat-h .who span{font-size:11.5px;opacity:.9}
.chat-h .av{width:40px;height:40px}
.back{border:0;background:none;color:var(--cream);text-shadow:0 2px 0 var(--shade);font-family:var(--f-pixel);font-size:24px;padding:0 4px}
.msgs{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:10px;}
.m{max-width:78%;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.m.me{align-self:flex-end;align-items:flex-end}
.m .b{padding:7px 11px;background:var(--field);border:3px solid var(--shade);border-radius:12px;overflow-wrap:anywhere}
.m.me .b{background:#FFD98A}
.m .ts{font-size:11px;color:var(--cream);text-shadow:0 1px 0 var(--shade)}
.m .imgb{border:3px solid var(--shade);border-radius:10px;padding:0;background:var(--field);overflow:hidden}
.m .imgb img{display:block;max-width:220px;max-height:220px;width:auto;height:auto}
.sys{align-self:center;font-family:var(--f-pixel);font-size:13px;padding:2px 12px;background:var(--cream);border:2px solid var(--pillb);border-radius:10px;display:flex;align-items:center;gap:6px}
.sys img{height:18px}
.composer{display:flex;gap:8px;align-items:center;margin:0 6px 4px}
.composer input[type=text]{flex:1}
.iconbtn{width:46px;min-width:46px;padding:0}
.iconbtn img{height:22px}
.poke-pop{position:absolute;left:-120px;top:42%;pointer-events:none;z-index:30}
.poke-pop img{width:96px;height:auto}
.poke-pop.run{animation:run 1.8s steps(12) forwards}
@keyframes run{0%{left:-120px}45%{left:calc(50% - 48px)}55%{left:calc(50% - 48px);transform:translateY(-18px)}100%{left:110%}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:40;background:rgba(30,18,10,.55);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.sheet{width:calc(100% - 12px)}
.sheet .inner{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.viewer{align-items:center;flex-direction:column;gap:16px;background:rgba(20,12,6,.9)}
.viewer img{max-width:100%;max-height:60vh;border:3px solid var(--cream)}
.viewer p{color:var(--cream);font-size:13px;text-align:center;margin:0;max-width:34ch}
.notif{position:absolute;left:8px;right:8px;top:8px;z-index:60;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;transform:translateY(-160%);transition:transform .35s steps(5)}
.notif.show{transform:translateY(0)}
.notif .ico{width:48px;height:48px;border-radius:50%;background:#CFE8F5;border:3px solid var(--shade);display:grid;place-items:end center;overflow:hidden}
.notif .ico img{width:88%}
.notif strong{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.notif strong em{font-style:normal;color:var(--muted);font-weight:400}
.notif p{margin:0;font-size:13.5px;line-height:1.45}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top gut">
    <div class="sign">
      <img class="ic" src="assets/ic_cal.png" alt="">
      <div class="d" id="hdr-date">—<small id="hdr-sub"></small></div>
      <div class="streak" title="連續打開天數"><img src="assets/star.png" alt="">4 天</div>
    </div>
  </header>

  <main class="gut">
    <!-- 夥伴 -->
    <section class="view" id="v-home">
      <div class="stage" id="stage">
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <button class="pet" id="pet" aria-label="摸摸吉祥物"><img id="pet-img" alt=""></button>
      </div>
      <div class="panel frame">
        <div class="plaque btn wood"><img src="assets/ic_cal.png" alt=""><span id="tmr-h">明天</span></div>
        <div class="inner" id="tmr-list"></div>
      </div>
    </section>

    <!-- 行程 -->
    <section class="view" id="v-sched" hidden>
      <div class="seg" role="group" aria-label="範圍">
        <button class="btn gold" data-range="0" aria-pressed="true">今天</button>
        <button class="btn wood" data-range="1" aria-pressed="false">明天</button>
        <button class="btn wood" data-range="7" aria-pressed="false">這週</button>
      </div>
      <div id="sched-list" class="stack"></div>
      <div class="actions"><button class="btn gold" id="btn-add">＋ 新增行程</button></div>
      <p class="note card">正式版會讀取你的 Google 日曆；iPhone 在「設定 › 日曆 › 帳號」加入同一個 Google 帳號，Apple 日曆也會同步顯示。</p>
    </section>

    <!-- 好友 -->
    <section class="view" id="v-friends" hidden>
      <div class="card">
        <div class="mycode">
          <div><div class="label">我的好友碼</div><div class="code" id="mycode">PXL-4821</div></div>
          <button class="btn wood" id="btn-copy">複製</button>
        </div>
        <form class="addf" id="addf" autocomplete="off">
          <input class="field-in" id="addf-code" type="text" placeholder="輸入好友碼，例如 PXL-7350" aria-label="朋友的好友碼">
          <button class="btn gold" type="submit">加好友</button>
        </form>
      </div>
      <div class="panel frame">
        <div class="plaque btn wood"><img src="assets/ic_friends.png" alt="">好友</div>
        <div class="inner" id="flist"></div>
      </div>
    </section>

    <!-- 設定 -->
    <section class="view" id="v-set" hidden>
      <div class="panel frame">
        <div class="plaque btn wood"><img src="assets/ic_heart.png" alt="">選擇夥伴</div>
        <div class="inner">
          <div class="pets" id="pets" role="radiogroup" aria-label="吉祥物"></div>
          <div class="field"><label for="set-name">夥伴的名字</label><input class="field-in" id="set-name" type="text" maxlength="8"></div>
          <div class="two">
            <div class="field"><label for="set-time">每晚提醒</label>
              <select class="field-in" id="set-time"><option>20:00</option><option selected>21:00</option><option>22:00</option><option>23:00</option></select></div>
            <div class="field"><label for="set-scene">場景</label>
              <select class="field-in" id="set-scene"><option value="auto">依時間自動</option><option value="day">白天</option><option value="dusk">黃昏</option><option value="night">夜晚</option></select></div>
          </div>
          <div class="actions"><button class="btn gold" id="btn-preview"><img src="assets/ic_mail.png" alt="">預覽今晚的提醒</button></div>
        </div>
      </div>
      <div class="card stack">
        <div class="conn"><div><strong>Google 日曆</strong><p>讀取今天到未來 7 天的行程</p></div><span class="tag">第二階段</span></div>
        <div class="conn"><div><strong>推播通知</strong><p>iPhone 需先「加入主畫面」</p></div><span class="tag">第二階段</span></div>
        <div class="conn"><div><strong>好友同步</strong><p>訊息與圖片存在 Supabase</p></div><span class="tag">第二階段</span></div>
      </div>
      <p class="note card">目前是前端原型：行程與好友是示範資料，你新增的內容只存在這台裝置的瀏覽器。</p>
    </section>
  </main>

  <nav class="tabs plank" role="tablist">
    <button class="wood" role="tab" data-tab="home" aria-selected="true"><img src="assets/ic_home.png" alt="">夥伴</button>
    <button class="wood" role="tab" data-tab="sched" aria-selected="false"><img src="assets/ic_cal.png" alt="">行程</button>
    <button class="wood" role="tab" data-tab="friends" aria-selected="false"><img src="assets/ic_friends.png" alt="">好友<span class="badge" id="tab-badge"></span></button>
    <button class="wood" role="tab" data-tab="set" aria-selected="false"><img src="assets/ic_gear.png" alt="">設定</button>
  </nav>

  <!-- chat -->
  <div class="chat" id="chat" hidden>
    <div class="chat-h plank">
      <button class="back" id="chat-back" aria-label="返回">‹</button>
      <div class="av" id="chat-av"></div>
      <div class="who"><strong id="chat-name"></strong><span id="chat-sub"></span></div>
      <button class="btn gold" id="chat-poke"><img src="assets/ic_hand.png" alt="">戳</button>
    </div>
    <div class="msgs gut" id="msgs"></div>
    <form class="composer plank" id="composer" autocomplete="off">
      <label class="btn wood iconbtn" title="傳送圖片"><input id="img-in" type="file" accept="image/*" hidden><img src="assets/ic_camera.png" alt="傳送圖片"></label>
      <input class="field-in" id="msg-in" type="text" placeholder="傳個訊息關心一下…" aria-label="訊息">
      <button class="btn gold" type="submit">送出</button>
    </form>
    <div class="poke-pop" id="poke-pop"><img id="poke-img" alt=""></div>
  </div>

  <!-- add event -->
  <div class="overlay" id="sheet" hidden>
    <form class="sheet panel frame" id="ev-form" autocomplete="off">
      <div class="plaque btn wood"><img src="assets/ic_cal.png" alt="">新增行程</div>
      <div class="inner">
        <div class="field"><label for="ev-title">內容</label><input class="field-in" id="ev-title" type="text" required placeholder="例如：剪頭髮"></div>
        <div class="two">
          <div class="field"><label for="ev-day">日期</label><select class="field-in" id="ev-day"><option value="0">今天</option><option value="1" selected>明天</option><option value="2">後天</option></select></div>
          <div class="field"><label for="ev-time">時間</label><input class="field-in" id="ev-time" type="time" value="15:00" required></div>
        </div>
        <div class="two">
          <div class="field"><label for="ev-loc">地點</label><input class="field-in" id="ev-loc" type="text" placeholder="選填"></div>
          <div class="field"><label for="ev-cal">分類</label><select class="field-in" id="ev-cal"><option value="life">私人</option><option value="work">工作</option></select></div>
        </div>
        <div class="actions"><button class="btn gold" type="submit">加入行程</button><button class="btn wood" type="button" id="ev-cancel">取消</button></div>
      </div>
    </form>
  </div>

  <!-- image viewer -->
  <div class="overlay viewer gut" id="viewer" hidden>
    <img id="viewer-img" alt="聊天圖片">
    <div class="actions"><button class="btn gold" id="viewer-dl">下載原圖</button><button class="btn wood" id="viewer-x">關閉</button></div>
    <p id="viewer-hint">若無法下載，請長按圖片儲存。</p>
  </div>

  <div class="notif card" id="notif" role="status">
    <div class="ico" id="notif-ico"></div>
    <div><strong><span id="notif-who"></span><em id="notif-time"></em></strong><p id="notif-text"></p></div>
  </div>
  <div class="toast btn wood" id="toast"></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const load=(k,d)=>{try{const v=localStorage.getItem('ppal2:'+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('ppal2:'+k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- mascots (AI art, cut from animal_action.png) ---------- */
const PETS={
  shiba:{label:'柴犬',def:'小柴',h:{idle:256,happy:258,sleep:208,alert:252}},
  beagle:{label:'米格魯',def:'豆豆',h:{idle:219,happy:238,sleep:203,alert:241}},
  parrot:{label:'鸚鵡',def:'啾啾',h:{idle:185,happy:218,sleep:175,alert:199}}};
const art=(p,a)=>`assets/${p}_${a}.png`;
Object.keys(PETS).forEach(p=>['idle','happy','sleep','alert','blink'].forEach(a=>{new Image().src=art(p,a)}));
function petImg(p,a='idle'){const im=new Image();im.src=art(p,a);im.alt='';return im}

/* ---------- state ---------- */
const st={pet:load('pet','shiba'),name:load('name',null),time:load('time','21:00'),scene:load('scene','auto'),range:0,
  userEv:load('events',[]),done:load('done',{}),unread:load('unread',{mi:1,mina:2}),chat:null,tab:'home',mood:null};
if(!st.name)st.name=PETS[st.pet].def;

function dkey(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const WK='日一二三四五六';
function dlabel(k){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);return `${m}月${d}日 週${WK[dt.getDay()]}`}
const SEED=[
  {id:'s1',o:0,t:'10:00',title:'產品週會',loc:'3F 會議室',cal:'work'},
  {id:'s2',o:0,t:'12:30',title:'跟小米吃午餐',loc:'公司樓下拉麵店',cal:'life'},
  {id:'s3',o:0,t:'19:30',title:'健身房 腿日',loc:'',cal:'life'},
  {id:'s4',o:1,t:'09:30',title:'牙醫回診',loc:'仁愛路診所',cal:'life'},
  {id:'s5',o:1,t:'12:00',title:'Mina 生日午餐',loc:'東區義大利餐廳',cal:'life'},
  {id:'s6',o:1,t:'15:00',title:'象山散步',loc:'象山步道口',cal:'life'},
  {id:'s7',o:2,t:'10:00',title:'新專案提案',loc:'線上會議',cal:'work'},
  {id:'s8',o:3,t:'19:00',title:'跟阿哲吃火鍋',loc:'公館',cal:'life'},
  {id:'s9',o:5,t:'20:00',title:'線上桌遊夜',loc:'Discord',cal:'life'}];
function allEv(){return SEED.map(e=>({...e,d:dkey(e.o)})).concat(st.userEv).sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t))}
const evOn=k=>allEv().filter(e=>e.d===k);
function catIcon(e){if(/餐|吃|飯|鍋|咖啡|早午/.test(e.title))return 'ic_food';if(/山|步道|散步|健身|跑|爬/.test(e.title))return 'ic_mount';
  if(/生日|約會|紀念/.test(e.title))return 'ic_heart';if(e.cal==='work')return 'ic_bag';return 'ic_cal'}
function rowHTML(e,withChk){return `<div class="row ${withChk?'sch':''} ${st.done[e.id]?'done':''}">
  ${withChk?`<button class="chk" role="checkbox" aria-checked="${!!st.done[e.id]}" aria-label="完成 ${esc(e.title)}" data-id="${e.id}"></button>`:'<img class="ck" src="assets/ic_clock.png" alt="">'}
  <span class="t">${e.t}</span><span class="sep"></span><img class="cat" src="assets/${catIcon(e)}.png" alt="">
  <div class="ti"><strong>${esc(e.title)}</strong>${e.loc?`<span>${esc(e.loc)}</span>`:''}</div></div>`}

/* ---------- scene / time of day ---------- */
function sceneNow(){if(st.scene!=='auto')return st.scene;const h=new Date().getHours();return h>=6&&h<17?'day':h>=17&&h<19?'dusk':'night'}
const sleeping=()=>{const h=new Date().getHours();return st.scene==='auto'?(h>=23||h<6):false};
function applyScene(){const bg=st.tab==='home'?`bg_${sceneNow()}`:'bg_room';$('#app').style.setProperty('--bg',`url(assets/${bg}.webp)`)}

/* ---------- header ---------- */
function header(){const k=dkey(0);const [,m,d]=k.split('-').map(Number);
  $('#hdr-date').firstChild.nodeValue=`${m}月${d}日 週${WK[new Date().getDay()]}`;
  $('#hdr-sub').textContent=`今天 ${evOn(k).length} 件事`;}

/* ---------- mascot ---------- */
function line(){const tm=evOn(dkey(1)),n=tm.length,f=tm[0],p=st.pet;
  if(p==='parrot')return n?`明天！明天！${n} 件事！\n${f.t}「${f.title}」啾！`:'明天放假！\n放假！啾啾！';
  if(p==='beagle')return n?`嗅嗅！明天 ${n} 個行程！\n先去 ${f.t}「${f.title}」`:'明天沒有行程耶！\n帶我去散步嗎？';
  return n?`哼，明天 ${n} 件事。\n${f.t}「${f.title}」，早點睡。`:'明天沒事。\n那我也要放空。';}
const TAP={parrot:['啾！再摸一次！','你好你好你好！','記得喝水！喝水！'],beagle:['汪！最喜歡你了！','可以吃點心嗎？','尾巴停不下來！'],shiba:['……好啦，再摸一下。','不要一直摸。（尾巴在搖）','哼。']};
function bubble(txt){$('#bubble').innerHTML=`<b>${esc(st.name)}</b>${esc(txt).replace(/\n/g,'<br>')}<img class="tail" src="assets/bubble_tail.png" alt="">`;if(typeof setPose==='function'&&$('#pet-img').getAttribute('src'))setPose(pose())}
function petSize(){const stage=$('#stage');const H=stage.clientHeight||260;const target=Math.min(170,Math.max(84,H*.46));return target/PETS[st.pet].h.idle}
function setPose(pose){const im=$('#pet-img'),k=petSize();const src=art(st.pet,pose);if(im.getAttribute('src')!==src)im.setAttribute('src',src);
  const h=Math.round(PETS[st.pet].h[pose]*k);im.style.height=h+'px';
  placeBubble();}
/* bubble hugs its text; its tail tip (about 28px from its left edge) points down at the mascot's head */
function placeBubble(){requestAnimationFrame(()=>{const b=$('#bubble'),im=$('#pet-img'),stg=$('#stage');
  const sw=stg.clientWidth,sh=stg.clientHeight,iw=im.offsetWidth,ih=im.offsetHeight;if(!iw)return;
  b.style.maxWidth='';b.style.left='0px';const tl=b.querySelector('.tail');if(!tl)return;tl.hidden=false;
  const k=petSize(),P=PETS[st.pet].h,tallest=Math.max(P.idle,P.happy,P.alert)*k,idleH=P.idle*k;
  const bw=b.offsetWidth,bh=b.offsetHeight,TAILH=13,headX=sw*.47+iw*.08;
  let left=Math.round(headX-bw*.35);left=Math.max(6,Math.min(left,sw-6-bw));
  const ideal=Math.round(6+tallest+18+TAILH+4); /* clears the tallest pose at the top of its jump */
  const bottom=Math.min(ideal,sh-bh-2);
  if(bottom>=6+idleH+TAILH){b.style.left=left+'px';b.style.bottom=bottom+'px';
    tl.style.left=Math.max(12,Math.min(bw-17*2-23-6,Math.round(headX-left-17-6)))+'px';return}
  tl.hidden=true;
  /* no room above the head: sit beside it, narrowing to the space on the right */
  const sideLeft=Math.round(sw*.47+iw*.42);b.style.left=sideLeft+'px';b.style.maxWidth=Math.max(110,sw-sideLeft-6)+'px';
  requestAnimationFrame(()=>{const nbh=b.offsetHeight;b.style.bottom=Math.max(6,Math.min(Math.round(ih*.45),sh-nbh-2))+'px'});});}
addEventListener('resize',placeBubble);
$('#pet-img').addEventListener('load',placeBubble);if(document.fonts)document.fonts.ready.then(placeBubble);
function pose(){return st.mood||(sleeping()?'sleep':'idle')}
function home(){bubble(sleeping()?'Zzz……（明天的事，明天再說）':line());setPose(pose());
  const k=dkey(1);$('#tmr-h').textContent=`明天 · 週${WK[new Date(Date.now()+864e5).getDay()]}`;
  const tm=evOn(k);$('#tmr-list').innerHTML=tm.length?tm.map(e=>rowHTML(e,false)).join(''):'<p class="empty">明天沒有行程，好好休息。</p>';}
function mood(m,ms){st.mood=m;setPose(m);clearTimeout(mood._t);mood._t=setTimeout(()=>{st.mood=null;setPose(pose());bubble(sleeping()?'Zzz……':line())},ms)}
$('#pet').addEventListener('click',()=>{const p=$('#pet');p.classList.remove('jump');void p.offsetWidth;p.classList.add('jump');
  mood('happy',1600);const arr=TAP[st.pet];bubble(arr[Math.floor(Math.random()*arr.length)]);
  const stage=$('#stage'),r=stage.getBoundingClientRect(),pr=p.getBoundingClientRect();
  for(let i=0;i<3;i++){const h=document.createElement('img');h.src='assets/ic_heart.png';h.alt='';h.className='float-heart';
    h.style.left=(pr.left-r.left+pr.width*(.2+i*.3))+'px';h.style.top=(pr.top-r.top+10+(i%2)*16)+'px';h.style.animationDelay=(i*120)+'ms';
    stage.appendChild(h);setTimeout(()=>h.remove(),1600);}});
addEventListener('resize',()=>setPose(pose()));

/* ---------- schedule ---------- */
function sched(){const list=allEv();const keys=st.range===7?[...Array(7)].map((_,i)=>dkey(i)):[dkey(st.range)];
  const html=keys.map(k=>{const es=list.filter(e=>e.d===k);if(!es.length&&st.range===7)return'';
    return `<div class="panel frame"><div class="plaque btn wood"><img src="assets/ic_cal.png" alt="">${dlabel(k)}</div><div class="inner">${es.length?es.map(e=>rowHTML(e,true)).join(''):'<p class="empty">這天沒有行程。</p>'}</div></div>`}).join('');
  $('#sched-list').innerHTML=html||'<p class="empty card">這週沒有行程。</p>';}
$('#sched-list').addEventListener('click',e=>{const b=e.target.closest('.chk');if(!b)return;
  const id=b.dataset.id;st.done[id]=!st.done[id];save('done',st.done);sched();home();if(st.done[id])toast(`${st.name}：做得好！`);});
$$('.seg .btn').forEach(b=>b.addEventListener('click',()=>{st.range=+b.dataset.range;
  $$('.seg .btn').forEach(x=>{const on=x===b;x.setAttribute('aria-pressed',on);x.className='btn '+(on?'gold':'wood')});sched();}));
$('#btn-add').addEventListener('click',()=>{$('#sheet').hidden=false;$('#ev-title').focus()});
$('#ev-cancel').addEventListener('click',()=>$('#sheet').hidden=true);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true});
$('#ev-form').addEventListener('submit',e=>{e.preventDefault();
  const ev={id:'u'+Date.now(),d:dkey(+$('#ev-day').value),t:$('#ev-time').value,title:$('#ev-title').value.trim(),loc:$('#ev-loc').value.trim(),cal:$('#ev-cal').value};
  if(!ev.title)return;st.userEv.push(ev);save('events',st.userEv);$('#sheet').hidden=true;$('#ev-form').reset();sched();home();header();toast('已加入行程');});

/* ---------- friends ---------- */
const FRIENDS=load('friends',[
  {id:'mi',name:'小米',pet:'shiba',petName:'阿柴'},
  {id:'mina',name:'Mina',pet:'beagle',petName:'Lucky'},
  {id:'jer',name:'阿哲',pet:'parrot',petName:'嘎嘎'}]);
const MSGS=load('msgs',{
  mi:[{f:'me',x:'今天中午吃哪間？',ts:'09:05'},{f:'mi',x:'拉麵！12:30 不要遲到喔',ts:'09:12'}],
  mina:[{f:'mina',x:'今天下班看到的夕陽，送你當桌布',ts:'18:05'},{f:'mina',img:'assets/bg_dusk.webp',ts:'18:05'}],
  jer:[{f:'me',x:'週日火鍋還吃嗎？',ts:'昨天'},{f:'jer',x:'吃！公館那間，七點見',ts:'昨天'}]});
const REPLY={mi:['好啊','哈哈哈','收到～'],mina:['謝謝你！','明天見！','愛你～'],jer:['讚','OK der','走起']};
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const lastTxt=m=>m?(m.img?'[圖片]':m.poke?'戳了一下':m.x):'';
function avatar(p){const d=document.createElement('div');d.className='av';d.appendChild(petImg(p));return d}
function friends(){const box=$('#flist');box.innerHTML='';
  FRIENDS.forEach(fr=>{const ms=MSGS[fr.id]||[],last=ms[ms.length-1],u=st.unread[fr.id]||0;
    const b=document.createElement('button');b.className='fr';
    b.innerHTML=`<div class="meta"><strong>${esc(fr.name)}${u?`<span class="dot">${u}</span>`:''}</strong><span>${esc(lastTxt(last))}</span></div><span class="src">${last?esc(last.ts):''}</span>`;
    b.prepend(avatar(fr.pet));b.addEventListener('click',()=>openChat(fr.id));box.appendChild(b);});
  $('#tab-badge').hidden=!Object.values(st.unread).some(Boolean);}
$('#btn-copy').addEventListener('click',()=>{const c=$('#mycode').textContent;
  const sel=()=>{const r=document.createRange();r.selectNodeContents($('#mycode'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('已選取，請手動複製')};
  try{navigator.clipboard.writeText(c).then(()=>toast('已複製好友碼'),sel)}catch(e){sel()}});
$('#addf').addEventListener('submit',e=>{e.preventDefault();const v=$('#addf-code').value.trim().toUpperCase();
  if(!/^PXL-\d{4}$/.test(v)){toast('好友碼格式是 PXL-0000');return}
  const id='f'+v.slice(4);if(FRIENDS.some(f=>f.id===id)){toast('已經是好友了');return}
  FRIENDS.push({id,name:'新朋友 '+v.slice(4),pet:Object.keys(PETS)[+v.slice(-1)%3],petName:'小夥伴'});
  MSGS[id]=[{sys:1,x:'你們成為好友了',ts:now()}];save('friends',FRIENDS);save('msgs',MSGS);$('#addf-code').value='';friends();toast('已送出好友邀請（示範）');});
function chatRender(){const id=st.chat,fr=FRIENDS.find(f=>f.id===id),box=$('#msgs');
  box.innerHTML=(MSGS[id]||[]).map((m,i)=>{
    if(m.sys||m.poke)return `<div class="sys">${m.poke?'<img src="assets/ic_hand.png" alt="">':''}${esc(m.poke?(m.f==='me'?`你戳了 ${fr.name} 一下`:`${fr.name} 戳回來了！`):m.x)}</div>`;
    const me=m.f==='me';
    return `<div class="m ${me?'me':''}">${m.img?`<button class="imgb" aria-label="查看圖片"><img src="${m.img}" alt="聊天圖片"></button>`:`<div class="b">${esc(m.x)}</div>`}<span class="ts">${esc(m.ts)}</span></div>`}).join('');
  box.scrollTop=box.scrollHeight;}
function openChat(id){st.chat=id;const fr=FRIENDS.find(f=>f.id===id);
  $('#chat-name').textContent=fr.name;$('#chat-sub').textContent=`夥伴：${PETS[fr.pet].label}「${fr.petName}」`;
  const av=$('#chat-av');av.innerHTML='';av.appendChild(petImg(fr.pet));$('#poke-img').src=art(fr.pet,'happy');
  st.unread[id]=0;save('unread',st.unread);$('#chat').hidden=false;chatRender();friends();}
$('#chat-back').addEventListener('click',()=>{$('#chat').hidden=true;st.chat=null;friends()});
function push(id,m){(MSGS[id]=MSGS[id]||[]).push(m);save('msgs',MSGS);if(st.chat===id)chatRender();}
function fakeReply(id){setTimeout(()=>{const r=REPLY[id]||['嗨！'];push(id,{f:id,x:r[Math.floor(Math.random()*r.length)],ts:now()});
  if(st.chat!==id){st.unread[id]=(st.unread[id]||0)+1;save('unread',st.unread);friends()}},1600)}
$('#composer').addEventListener('submit',e=>{e.preventDefault();const v=$('#msg-in').value.trim();if(!v)return;
  push(st.chat,{f:'me',x:v,ts:now()});$('#msg-in').value='';fakeReply(st.chat);});
$('#chat-poke').addEventListener('click',()=>{const id=st.chat;push(id,{f:'me',poke:1,ts:now()});
  const pp=$('#poke-pop');pp.classList.remove('run');void pp.offsetWidth;pp.classList.add('run');
  setTimeout(()=>push(id,{f:id,poke:1,ts:now()}),2000);});
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)})}
$('#img-in').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const url=await compress(f);push(st.chat,{f:'me',img:url,ts:now()});toast('圖片已壓縮並送出');fakeReply(st.chat)}catch(err){toast('這張圖片讀不到，換一張試試')}});
$('#msgs').addEventListener('click',e=>{const b=e.target.closest('.imgb');if(!b)return;$('#viewer-img').src=b.querySelector('img').src;$('#viewer').hidden=false;});
$('#viewer-x').addEventListener('click',()=>$('#viewer').hidden=true);
$('#viewer-hint').textContent='手機上會打開分享選單，選「儲存影像」即可存到相簿。';
$('#viewer-dl').addEventListener('click',async()=>{const src=$('#viewer-img').src;
  try{const blob=await (await fetch(src)).blob();const ext=/png/.test(blob.type)?'png':/webp/.test(blob.type)?'webp':'jpg';
    const name='pixel-pal-'+Date.now()+'.'+ext,file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast('已下載原圖')}
  catch(err){if(err&&err.name==='AbortError')return;toast('下載失敗，請長按圖片儲存')}});

/* ---------- settings ---------- */
function settings(){const box=$('#pets');box.innerHTML='';
  Object.entries(PETS).forEach(([k,sp])=>{const b=document.createElement('button');b.className='pick';b.setAttribute('role','radio');b.setAttribute('aria-checked',k===st.pet);
    const im=petImg(k);im.className='p';b.appendChild(im);const s=document.createElement('span');s.textContent=sp.label;b.appendChild(s);
    b.addEventListener('click',()=>{const old=PETS[st.pet].def;st.pet=k;save('pet',k);
      if(st.name===old){st.name=sp.def;save('name',st.name);$('#set-name').value=st.name}settings();home();toast(`${sp.label}「${st.name}」來報到了`)});
    box.appendChild(b)});
  $('#set-name').value=st.name;$('#set-time').value=st.time;$('#set-scene').value=st.scene;}
$('#set-name').addEventListener('input',e=>{st.name=e.target.value.trim()||PETS[st.pet].def;save('name',st.name);home()});
$('#set-time').addEventListener('change',e=>{st.time=e.target.value;save('time',st.time);toast(`每晚 ${st.time} 提醒你`)});
$('#set-scene').addEventListener('change',e=>{st.scene=e.target.value;save('scene',st.scene);home();toast('場景已切換，回到「夥伴」看看')});

/* ---------- notification preview ---------- */
$('#btn-preview').addEventListener('click',()=>{go('home');const tm=evOn(dkey(1));const ic=$('#notif-ico');ic.innerHTML='';ic.appendChild(petImg(st.pet,'alert'));
  $('#notif-who').textContent=`像素行程夥伴 · ${st.name}`;$('#notif-time').textContent=st.time;
  $('#notif-text').textContent=tm.length?`明天有 ${tm.length} 件事，第一件是 ${tm[0].t}「${tm[0].title}」。早點睡喔！`:'明天沒有行程，可以睡晚一點。';
  mood('alert',3200);bubble('叮咚！今晚會這樣提醒你！');
  const n=$('#notif');n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),4200);});
$('#notif').addEventListener('click',()=>$('#notif').classList.remove('show'));

/* ---------- tabs ---------- */
function go(tab){st.tab=tab;$('#app').dataset.tab=tab;$$('nav.tabs button').forEach(b=>{const on=b.dataset.tab===tab;b.setAttribute('aria-selected',on);b.className=on?'gold':'wood'});
  ['home','sched','friends','set'].forEach(t=>$('#v-'+t).hidden=t!==tab);document.querySelector('main').scrollTop=0;applyScene();if(tab==='home')setPose(pose());}
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.go);st.range=1;
  $$('.seg .btn').forEach(x=>{const on=x.dataset.range==='1';x.setAttribute('aria-pressed',on);x.className='btn '+(on?'gold':'wood')});sched()}));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- idle bob ---------- */
let tick=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function blink(){if(st.tab!=='home'||st.mood||sleeping())return;const im=$('#pet-img');im.setAttribute('src',art(st.pet,'blink'));
  setTimeout(()=>{if(!st.mood&&im.getAttribute('src')===art(st.pet,'blink'))im.setAttribute('src',art(st.pet,pose()))},170)}
function frame(){tick++;if(tick%8===5||tick%23===0)blink();$('#pet').classList.toggle('bob',!st.mood&&!sleeping()&&tick%2===1);if(tick%60===0){applyScene();if(!st.mood)setPose(pose())}}

header();applyScene();home();sched();friends();settings();go('home');
requestAnimationFrame(()=>setPose(pose()));
if(!reduce)setInterval(frame,520);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
