<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素行程夥伴</title>
<meta name="description" content="像素風行程助手：吉祥物每晚提醒你明天的行程，還能和好友互傳訊息。">
<meta name="theme-color" content="#7A4424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="行程夥伴">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;background:#3A2A1E}
body{margin:0;overscroll-behavior:none}
img{max-width:100%}
/* Layout: full-screen illustrated scene; hanging wooden sign on top, mascot standing on the grass,
   framed parchment panels and a wooden tab bar built from the cut UI-kit images (border-image 9-slice).
   Single fixed visual world (cozy daylight wood + parchment), so no dark variant. */
:root{
  --ink:#5A3322; --muted:#8C6A4F; --cream:#FFF3DC; --pill:#FCEBCB; --pillb:#E4C08A; --field:#FFF8EA; --fieldb:#C99A63;
  --gold:#F4B63E; --red:#E2483B; --shade:#4A2614; --scene:#5DB0EA;
  --f-pixel:"DotGothic16","Noto Sans TC",ui-monospace,monospace;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#3A2A1E;color:var(--ink);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
img{-webkit-user-drag:none}

.app{max-width:480px;margin:0 auto;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:var(--scene) var(--bg,url(assets/bg_day.webp)) center top/cover no-repeat;transition:background-image .4s;image-rendering:pixelated}
.app::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(60,30,12,.22),rgba(60,30,12,.38));opacity:0;transition:opacity .3s;pointer-events:none}
.app:not([data-tab="home"])::before{opacity:1}
.app>header,.app>main,.app>nav{position:relative}
.app img{image-rendering:auto}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* ---------- art pieces ---------- */
.frame{border:26px solid transparent;border-image:url(assets/frame.png) 72 fill / 26px stretch}
.card{border:14px solid transparent;border-image:url(assets/card.png) 40 fill / 14px stretch}
.wood{border:12px solid transparent;border-image:url(assets/btn_wood.png) 40 fill / 12px stretch;color:var(--cream);text-shadow:0 2px 0 var(--shade)}
.gold{border:12px solid transparent;border-image:url(assets/btn_gold.png) 40 fill / 12px stretch;color:#5A2E10;text-shadow:0 1px 0 rgba(255,240,200,.7)}
.plank{border:18px solid transparent;border-image:url(assets/plank.png) 60 fill / 18px stretch}
.btn{font-family:var(--f-pixel);font-size:15px;padding:0 10px;min-height:22px;line-height:22px;background:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(2px)}
.btn img{height:20px;width:auto}
.ic{width:auto;display:block}

/* ---------- header sign ---------- */
header.top{display:flex;justify-content:center;padding-top:0;flex:0 0 auto}
.sign{width:min(100%,400px);aspect-ratio:1028/327;background:url(assets/sign.png) center/100% 100% no-repeat;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:14.7% 10.5% 6.1%;margin-top:-4px}
.sign .ic{height:clamp(28px,8.6vw,36px)}
.sign .d{font-family:var(--f-pixel);color:var(--cream);text-shadow:0 2px 0 var(--shade);font-size:clamp(14px,4.3vw,20px);line-height:1.15;min-width:0;white-space:nowrap}
.sign .d small{display:block;font-size:12px;opacity:.9;letter-spacing:.04em}
.streak{display:flex;align-items:center;gap:4px;background:var(--cream);border:3px solid var(--shade);border-radius:12px;padding:2px 8px 2px 4px;font-family:var(--f-pixel);font-size:13px;color:var(--ink)}
.streak img{height:20px}

main{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;min-height:0}
.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 16px;min-height:100%}
#v-home{gap:0;padding-bottom:10px}

/* ---------- stage ---------- */
.stage{position:relative;flex:1 1 auto;min-height:190px}
.app.booting main,.app.booting nav,.app.booting .sign .d,.app.booting .sign .streak{visibility:hidden}
.cal-err{margin:0;padding:6px 10px;border-radius:8px;background:#FBE0D2;border:2px solid #D9805A;color:#7A2E12;font-size:13px}
.pet{position:absolute;left:47%;bottom:6px;transform:translateX(-50%);border:0;background:none;padding:0;display:flex;align-items:flex-end;justify-content:center}
.pet::before{content:"";position:absolute;left:14%;right:14%;bottom:-5px;height:14px;border-radius:50%;background:rgba(28,52,12,.38);box-shadow:0 0 0 4px rgba(28,52,12,.14)}
.pet img{position:relative;display:block;height:auto}
.pet img{transform-origin:50% 100%}
.pet.bob img{transform:scale(1.015,.97)}
.pet.jump img{animation:jump .7s steps(5) 1}
.pet.wiggle img{animation:wiggle 1.2s ease-in-out 1}
/* lying poses rock gently on their back around the body centre, not the feet */
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}50%{transform:rotate(2deg)}75%{transform:rotate(-1deg)}}
.pet.lying img{transform-origin:50% 72%;margin-bottom:-8px}
.pet.lying.bob img{transform:none}
.pet.lying::before{left:6%;right:6%;bottom:-6px;height:18px}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px)}65%{transform:translateY(-10px)}}
.bubble{position:absolute;bottom:60%;left:50%;width:max-content;max-width:min(280px,calc(100% - 12px));border:17px solid transparent;
  border-image:url(assets/bubble_body.png) 60 fill / 17px stretch;
  padding:0 6px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.bubble{text-align:center}
.bubble .nw{white-space:nowrap}
.bubble .tail{position:absolute;top:calc(100% + 8px);left:20px;width:23px;height:auto;pointer-events:none}
.bubble b{font-family:var(--f-pixel);font-weight:400;color:#A6431C;font-size:13px;margin-right:5px}
.float-heart{position:absolute;width:26px;pointer-events:none;animation:floaty 1.2s steps(6) forwards}
@keyframes floaty{to{transform:translateY(-80px);opacity:0}}

/* ---------- panels ---------- */
.panel{position:relative;margin-top:22px}
.panel .inner{display:flex;flex-direction:column;gap:8px;padding-top:18px}
.plaque{position:absolute;left:50%;top:-40px;transform:translateX(-50%);z-index:2;padding:0 14px;min-height:24px;font-size:15px}
.plaque img{height:22px}
.row{display:grid;grid-template-columns:22px 46px 3px 28px 1fr;align-items:center;gap:8px;padding:6px 10px;background:var(--pill);border:3px solid var(--pillb);border-radius:14px;min-width:0}
.row .ck{height:20px}
.row .t{font-family:var(--f-pixel);font-variant-numeric:tabular-nums;font-size:15px}
.row .sep{align-self:stretch;background:var(--pillb);border-radius:2px}
.row .cat{height:24px;max-width:28px;object-fit:contain;justify-self:center}
.row .ti{min-width:0}
.row .ti strong{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .ti strong{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.75}
.row.past{opacity:.45}
.row .next{font-style:normal;font-family:var(--f-pixel);font-size:11px;font-weight:400;background:var(--gold);color:#5A2E10;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.plaque .swap{font-size:12px;opacity:.85;margin-left:2px}
.plaque:active{transform:translate(-50%,2px)}
.empty{color:var(--muted);font-size:14px;margin:4px 2px}
.chk{width:24px;height:24px;border:3px solid var(--shade);background:var(--field);border-radius:6px;padding:0}
.chk[aria-checked="true"]{background:var(--gold) url(assets/star.png) center/16px no-repeat}
.row.sch{grid-template-columns:24px 46px 3px 28px 1fr}
h2{font-family:var(--f-pixel);font-weight:400;font-size:17px;margin:0;color:var(--ink)}
.on-scene{color:var(--cream);text-shadow:0 2px 0 var(--shade),0 0 6px rgba(0,0,0,.35)}
.seg{display:flex;gap:8px}
.seg .btn{flex:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.note{font-size:12.5px;color:var(--muted);margin:0}
.src{font-size:12px;color:var(--muted)}

/* ---------- friends ---------- */
.mycode{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mycode .code{font-family:var(--f-pixel);font-size:22px;letter-spacing:.08em}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.field-in{border:3px solid var(--fieldb);background:var(--field);border-radius:10px;padding:7px 10px;min-width:0;width:100%}
.addf{display:flex;gap:8px;margin-top:10px}
.addf input{flex:1}
.fr{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--pill);border:3px solid var(--pillb);border-radius:14px;padding:6px 10px}
.av{width:52px;height:52px;border-radius:50%;background:#CFE8F5;border:3px solid var(--shade);display:grid;place-items:end center;overflow:hidden}
.av img{width:84%;height:auto;margin-bottom:-2px}
.fr .meta{min-width:0}
.fr .meta strong{display:flex;align-items:center;gap:6px;font-weight:500}
.fr .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{min-width:22px;height:20px;padding:0 4px;background:url(assets/badge.png) center/100% 100% no-repeat;color:#fff;font-family:var(--f-pixel);font-size:12px;display:inline-grid;place-items:center}

/* ---------- settings ---------- */
.pets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick{position:relative;background:var(--pill);border:3px solid var(--pillb);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick img.p{height:68px;width:auto;object-fit:contain}
.pick span{font-family:var(--f-pixel);font-size:14px}
.pick[aria-checked="true"]{background:#FFE3A0;border-color:#D89A2C}
.pick[aria-checked="true"]::after{content:"";position:absolute;right:-6px;top:-8px;width:26px;height:26px;background:url(assets/star.png) center/contain no-repeat}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.conn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.conn p{margin:0;font-size:12.5px;color:var(--muted)}
.tag{font-family:var(--f-pixel);font-size:12px;padding:1px 8px;border:2px solid var(--pillb);border-radius:8px;color:var(--muted);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- tab bar ---------- */
nav.tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 6px 4px;padding-block:0}
nav.tabs button{background:none;padding:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:var(--f-pixel);font-size:11px;position:relative}
nav.tabs button img{height:28px;width:auto}
nav.tabs .badge{position:absolute;top:-12px;right:-10px;width:22px;height:16px;background:url(assets/badge.png) center/100% 100% no-repeat}

/* ---------- chat ---------- */
.chat{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(rgba(60,30,12,.3),rgba(60,30,12,.45)),var(--scene) url(assets/bg_chat.webp) center/cover no-repeat;image-rendering:pixelated}
.chat-h{display:flex;align-items:center;gap:10px;margin:6px 6px 0}
.chat-h .who{flex:1;min-width:0;color:var(--cream);text-shadow:0 2px 0 var(--shade)}
.chat-h .who strong{display:block;font-family:var(--f-pixel);font-weight:400;font-size:17px;line-height:1.2}
.chat-h .who span{font-size:11.5px;opacity:.9}
.chat-h .av{width:40px;height:40px}
.back{border:0;background:none;color:var(--cream);text-shadow:0 2px 0 var(--shade);font-family:var(--f-pixel);font-size:24px;padding:0 4px}
.msgs{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:10px;}
.m{max-width:78%;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.m.me{align-self:flex-end;align-items:flex-end}
.m .b{padding:7px 11px;background:var(--field);border:3px solid var(--shade);border-radius:12px;overflow-wrap:anywhere}
.m.me .b{background:#FFD98A}
.m .ts{font-size:11px;color:var(--cream);text-shadow:0 1px 0 var(--shade)}
.m .imgb{border:3px solid var(--shade);border-radius:10px;padding:0;background:var(--field);overflow:hidden}
.m .imgb img{display:block;max-width:220px;max-height:220px;width:auto;height:auto}
.sys{align-self:center;font-family:var(--f-pixel);font-size:13px;padding:2px 12px;background:var(--cream);border:2px solid var(--pillb);border-radius:10px;display:flex;align-items:center;gap:6px}
.sys img{height:18px}
.composer{display:flex;gap:8px;align-items:center;margin:0 6px 4px}
.composer input[type=text]{flex:1}
.iconbtn{width:46px;min-width:46px;padding:0}
.iconbtn img{height:22px}
.poke-pop{position:absolute;left:-120px;top:42%;pointer-events:none;z-index:30}
.poke-pop img{width:96px;height:auto}
.poke-pop.run{animation:run 1.8s steps(12) forwards}
@keyframes run{0%{left:-120px}45%{left:calc(50% - 48px)}55%{left:calc(50% - 48px);transform:translateY(-18px)}100%{left:110%}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:40;background:rgba(30,18,10,.55);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.sheet{width:calc(100% - 12px)}
.sheet .inner{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.viewer{align-items:center;flex-direction:column;gap:16px;background:rgba(20,12,6,.9)}
.viewer img{max-width:100%;max-height:60vh;border:3px solid var(--cream)}
.viewer p{color:var(--cream);font-size:13px;text-align:center;margin:0;max-width:34ch}
.notif{position:absolute;left:8px;right:8px;top:8px;z-index:60;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;transform:translateY(-160%);transition:transform .35s steps(5)}
.notif.show{transform:translateY(0)}
.notif .ico{width:48px;height:48px;border-radius:50%;background:#CFE8F5;border:3px solid var(--shade);display:grid;place-items:end center;overflow:hidden}
.notif .ico img{width:88%}
.notif strong{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.notif strong em{font-style:normal;color:var(--muted);font-weight:400}
.notif p{margin:0;font-size:13.5px;line-height:1.45}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.login{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:0 16px 22px;
  background:var(--scene) url(assets/bg_day.webp) center top/cover no-repeat;image-rendering:pixelated}
.login img{image-rendering:auto}
.login-sign{grid-template-columns:auto 1fr auto}
.login-sign .d{font-size:clamp(17px,5.4vw,22px)}
.login-pet{width:min(46vw,190px);height:auto;filter:drop-shadow(0 8px 0 rgba(28,52,12,.25));animation:hop 1.6s steps(4) infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;text-align:center}
.login-card p{margin:0;font-size:14px}
.login-card .btn{min-height:30px;font-size:16px}
.login-card .fine{font-size:12px;color:var(--muted)}
.sign .demo-chip{grid-column:3;grid-row:1;font-size:12px;min-height:18px;line-height:18px;padding:0 6px;border-width:9px}
.sign:has(.demo-chip:not([hidden])) .streak{display:none}
.login-card .fine a,.note a{color:#A6431C;margin-left:6px}
@media (prefers-reduced-motion: reduce){.login-pet{animation:none}}
</style>
</head>
<body>

<div class="app booting" id="app">
  <header class="top gut">
    <div class="sign">
      <img class="ic" src="assets/ic_cal.png" alt="">
      <div class="d" id="hdr-date">—<small id="hdr-sub"></small></div>
      <div class="streak" title="連續打開天數"><img src="assets/star.png" alt=""><span id="streak-n">1 天</span></div>
      <button class="btn gold demo-chip" id="demo-chip" hidden>示範 · 登入</button>
    </div>
  </header>

  <main class="gut">
    <!-- 夥伴 -->
    <section class="view" id="v-home">
      <div class="stage" id="stage">
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <button class="pet" id="pet" aria-label="摸摸吉祥物"><img id="pet-img" alt=""></button>
      </div>
      <div class="panel frame">
        <button class="plaque btn wood" id="day-toggle" aria-label="切換今天或明天的行程"><img src="assets/ic_cal.png" alt=""><span id="tmr-h">明天</span><span class="swap" aria-hidden="true">⇄</span></button>
        <div class="inner" id="tmr-list"></div>
      </div>
    </section>

    <!-- 行程 -->
    <section class="view" id="v-sched" hidden>
      <div class="seg" role="group" aria-label="範圍">
        <button class="btn gold" data-range="0" aria-pressed="true">今天</button>
        <button class="btn wood" data-range="1" aria-pressed="false">明天</button>
        <button class="btn wood" data-range="7" aria-pressed="false">這週</button>
      </div>
      <div id="sched-list" class="stack"></div>
      <div class="actions"><button class="btn gold" id="btn-add">＋ 新增行程</button></div>
      <p class="note card" id="sched-note"></p>
    </section>

    <!-- 好友 -->
    <section class="view" id="v-friends" hidden>
      <div class="card">
        <div class="mycode">
          <div><div class="label">我的好友碼</div><div class="code" id="mycode">PXL-4821</div></div>
          <button class="btn wood" id="btn-copy">複製</button>
        </div>
        <form class="addf" id="addf" autocomplete="off">
          <input class="field-in" id="addf-code" type="text" placeholder="輸入好友碼，例如 PXL-7350" aria-label="朋友的好友碼">
          <button class="btn gold" type="submit">加好友</button>
        </form>
      </div>
      <div class="panel frame">
        <div class="plaque btn wood"><img src="assets/ic_friends.png" alt="">好友</div>
        <div class="inner" id="flist"></div>
      </div>
    </section>

    <!-- 設定 -->
    <section class="view" id="v-set" hidden>
      <div class="panel frame">
        <div class="plaque btn wood"><img src="assets/ic_heart.png" alt="">選擇夥伴</div>
        <div class="inner">
          <div class="pets" id="pets" role="radiogroup" aria-label="吉祥物"></div>
          <div class="field"><label for="set-name">夥伴的名字</label><input class="field-in" id="set-name" type="text" maxlength="8"></div>
          <div class="two">
            <div class="field"><label for="set-time">每晚提醒</label>
              <select class="field-in" id="set-time"><option>19:00</option><option>19:30</option><option>20:00</option><option>20:30</option><option selected>21:00</option><option>21:30</option><option>22:00</option><option>22:30</option><option>23:00</option><option>23:30</option></select></div>
            <div class="field"><label for="set-scene">場景</label>
              <select class="field-in" id="set-scene"><option value="auto">依時間自動</option><option value="day">白天</option><option value="dusk">黃昏</option><option value="night">夜晚</option></select></div>
          </div>
          <div class="actions"><button class="btn gold" id="btn-preview"><img src="assets/ic_mail.png" alt="">預覽今晚的提醒</button></div>
        </div>
      </div>
      <div class="card stack" id="acct"></div>
      <p class="note card" id="mode-note"></p>
      <p class="note card"><a href="privacy.html">隱私權政策</a></p>
    </section>
  </main>

/* ---------- live: calendar ---------- */
function gtoken(){try{const v=JSON.parse(sessionStorage.getItem('ppal2:gtok')||'null');return v&&v.exp>Date.now()?v.t:null}catch(e){return null}}
function keepToken(t){if(!t)return;try{sessionStorage.setItem('ppal2:gtok',JSON.stringify({t,exp:Date.now()+50*60e3}))}catch(e){}}
function range7(){const t0=new Date();t0.setHours(0,0,0,0);const t1=new Date(t0);t1.setDate(t1.getDate()+8);return [t0,t1]}
async function loadEvents(){const [t0,t1]=range7();
  const {data,error}=await sb.from('events').select('*').eq('user_id',ME).gte('starts_at',t0.toISOString()).lt('starts_at',t1.toISOString()).order('starts_at');
  if(error){toast('讀取行程失敗：'+error.message);return}
  st.liveEv=data.map(r=>{const d=new Date(r.starts_at);return {id:r.google_id,d:dkeyOf(d),t:r.all_day?'整天':hhmm(d),title:r.title,loc:r.location||'',cal:'life'}});}
async function syncCalendar(){const tok=gtoken();if(!tok)return 'no-token';const [t0,t1]=range7();
  const q=new URLSearchParams({timeMin:t0.toISOString(),timeMax:t1.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'250'});
  const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?'+q,{headers:{Authorization:'Bearer '+tok}});
  const clearTok=()=>{try{sessionStorage.removeItem('ppal2:gtok')}catch(e){}};
  if(r.status===401){clearTok();return 'no-token'}
  if(r.status===403){let reason='';try{const ej=await r.json();const er=ej.error||{};reason=(er.errors&&er.errors[0]&&er.errors[0].reason)||er.status||er.message||''}catch(e){}
    if(/insufficient|scope/i.test(reason)){clearTok();return 'no-scope'}
    if(/accessNotConfigured|SERVICE_DISABLED|has not been used|disabled/i.test(reason))throw new Error('API_DISABLED');
    throw new Error('Google 日曆拒絕存取（'+(reason||403)+'）')}
  if(!r.ok)throw new Error('Google 日曆回應 '+r.status);
  const j=await r.json();
  const rows=(j.items||[]).filter(e=>e.status!=='cancelled'&&e.start).map(e=>({user_id:ME,google_id:e.id,
    starts_at:e.start.dateTime?new Date(e.start.dateTime).toISOString():new Date(e.start.date+'T00:00:00').toISOString(),
    title:e.summary||'（未命名行程）',location:e.location||null,all_day:!e.start.dateTime,updated_at:new Date().toISOString()}));
  const del=await sb.from('events').delete().eq('user_id',ME).gte('starts_at',t0.toISOString()).not('google_id','like','local-%');
  if(del.error)throw del.error;
  if(rows.length){const up=await sb.from('events').upsert(rows);if(up.error)throw up.error}
  st.lastSync=new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});save('lastSync',st.lastSync);
  save('calLinked',true);return rows.length;}
const calLinked=()=>!!load('calLinked',false);
/* manual: user pressed the button. afterConnect: we just came back from Google's consent screen — never redirect again from here (no loops) */
function calError(msg){st.calErr=msg;account();if(msg){go('set');toast('日曆連結沒有成功，請看下方說明');requestAnimationFrame(()=>{const e=$('.cal-err');if(e)e.scrollIntoView({block:'center',behavior:'smooth'})})}}
async function doSync(manual,afterConnect){st.calErr=null;try{const n=await syncCalendar();
    if(n==='no-token'){if(afterConnect)calError('Google 沒有回傳日曆權限。請再按一次「連結日曆」；如果一直出現這個訊息，請截圖給開發者。');else if(manual)connectCalendar();return}
    if(n==='no-scope'){calError('授權時沒有勾選「查看你的日曆」。再按一次「連結日曆」，在 Google 的授權畫面把日曆那一項打勾，再按「繼續」。');return}

  catch(e){if(e.message==='API_DISABLED')calError('Google Cloud 專案還沒啟用 Google Calendar API。到 APIs & Services → Library 搜尋「Google Calendar API」按「啟用」，等 1～2 分鐘後再按「同步日曆」。');
    else calError('同步失敗：'+(e.message||e))}}

    on:`已開啟，每晚 ${t} 提醒你明天的行程。`,off:`開啟後，每晚 ${t} 夥伴會傳通知提醒你。`}[s];
  const btns=s==='on'?'<button class="btn wood" id="btn-push-test">打聲招呼</button><button class="btn wood" id="btn-push-off">關閉</button>':
    s==='off'?'<button class="btn gold" id="btn-push-on">開啟通知</button>':'';
  return `<div><strong>每晚推播</strong><p>${info}</p></div><div class="actions" style="flex-wrap:nowrap">${btns}</div>`}
function bindPush(){const on=$('#btn-push-on'),off=$('#btn-push-off'),test=$('#btn-push-test');
  if(on)on.onclick=enablePush;if(off)off.onclick=disablePush;if(test)test.onclick=testPush;}
function renderPush(){const r=$('#push-row');if(r){r.innerHTML=pushRowHTML();bindPush()}}
async function savePushSub(sub){const j=sub.toJSON();
  const {error}=await sb.from('push_subscriptions').upsert({user_id:ME,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
  if(error)throw error}
async function enablePush(){try{
    const perm=await Notification.requestPermission();if(perm!=='granted'){renderPush();toast('沒有允許通知');return}
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(VAPID_PUBLIC)});
    await savePushSub(sub);st.pushOn=true;renderPush();toast('已開啟每晚提醒！按「測試」看看效果');}
  catch(e){toast('開啟失敗：'+(e.message||e))}}
async function disablePush(){try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}
    st.pushOn=false;renderPush();toast('已關閉每晚提醒')}catch(e){toast('關閉失敗：'+(e.message||e))}}
async function testPush(){try{toast(`正在叫${st.name}…`);const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/nightly-reminder',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({test:true})});
    const j=await r.json().catch(()=>({}));
    if(r.status===404)toast('還沒部署推播程式（nightly-reminder）');else if(!r.ok)toast('測試失敗：'+(j.error||r.status));
    else toast(j.sent?`${st.name}馬上就來打招呼！`:'沒有找到這台裝置的訂閱，請先關閉再開啟一次');}
  catch(e){toast('測試失敗：'+(e.message||e))}}
async function syncPush(){if(!pushSupported()||(isIOS&&!standalone()))return;try{
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    st.pushOn=!!sub&&Notification.permission==='granted';if(st.pushOn)await savePushSub(sub);renderPush()}catch(e){}}
function account(){const box=$('#acct');
  if(isLive()){const nm=PROFILE?PROFILE.display_name:'';const em=USER?USER.email:'';
    box.innerHTML=`<div class="conn"><div><strong>${esc(nm)}</strong><p>${esc(em)}</p></div><button class="btn wood" id="btn-logout">登出</button></div>
      <div class="conn"><div><strong>Google 日曆</strong><p>${calLinked()?'上次同步 '+esc(st.lastSync||'—'):'未連結，連結後夥伴才能提醒行程'}</p></div><button class="btn gold" id="btn-sync">${calLinked()?'同步日曆':'連結日曆'}</button></div>${st.calErr?`<p class="cal-err">${esc(st.calErr)}</p>`:''}
      <div class="conn" id="push-row">${pushRowHTML()}</div>`;
    $('#btn-logout').onclick=async()=>{save('calLinked',false);save('lastSync',null);await sb.auth.signOut();try{sessionStorage.clear()}catch(e){}location.reload()};
    $('#btn-sync').onclick=()=>doSync(true);bindPush();
    $('#mode-note').textContent='你的行程、好友和訊息都存在雲端，換手機登入同一個 Google 帳號也看得到。';}
  else{box.innerHTML=`<div class="conn"><div><strong>示範模式</strong><p>登入後才會讀取你的 Google 日曆、和好友聊天</p></div><button class="btn gold" id="btn-login2">登入</button></div>`;
    $('#btn-login2').onclick=()=>sb?signIn():toast('目前連不到伺服器，請稍後再試');
    $('#mode-note').textContent='示範模式：行程與好友是假資料，你新增的內容只存在這台裝置的瀏覽器。';}}

/* ---------- notification preview ---------- */
$('#btn-preview').addEventListener('click',()=>{go('home');const tm=evOn(dkey(1));const ic=$('#notif-ico');ic.innerHTML='';ic.appendChild(petImg(st.pet,'alert'));
  $('#notif-who').textContent=`像素行程夥伴 · ${st.name}`;$('#notif-time').textContent=st.time;
  $('#notif-text').textContent=tm.length?`明天有 ${tm.length} 件事，第一件是 ${tm[0].t}「${tm[0].title}」。早點睡喔！`:'明天沒有行程，可以睡晚一點。';
  mood('alert',3200);bubble('叮咚！今晚會這樣提醒你！');
  const n=$('#notif');n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),4200);});
$('#notif').addEventListener('click',()=>$('#notif').classList.remove('show'));

/* ---------- tabs ---------- */
function go(tab){if(tab!=='home')st.dayPick=null;st.tab=tab;$('#app').dataset.tab=tab;$$('nav.tabs button').forEach(b=>{const on=b.dataset.tab===tab;b.setAttribute('aria-selected',on);b.className=on?'gold':'wood'});
  ['home','sched','friends','set'].forEach(t=>$('#v-'+t).hidden=t!==tab);document.querySelector('main').scrollTop=0;applyScene();if(tab==='home')setPose(pose());}
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}

/* ---------- idle animation ---------- */
let tick=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function blink(){if(st.tab!=='home'||st.mood||sleeping())return;const im=$('#pet-img');im.setAttribute('src',art(petKey(st.pet),'blink'));
  setTimeout(()=>{if(!st.mood&&im.getAttribute('src')===art(petKey(st.pet),'blink'))im.setAttribute('src',art(petKey(st.pet),pose()))},170)}
function frame(){tick++;if(tick%8===5||tick%23===0)blink();$('#pet').classList.toggle('bob',!st.mood&&!sleeping()&&tick%2===1);if(tick%60===0){applyScene();header();if(!st.mood&&st.tab==='home')home()}}

/* ---------- sign in / start ---------- */
async function signIn(){if(!sb){toast('目前連不到伺服器，請稍後再試');return}
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
  if(error)toast('登入失敗：'+error.message);}
/* calendar is a separate, optional consent: only people who want reminders see Google's calendar-permission screen */
async function connectCalendar(){if(!sb)return;try{sessionStorage.setItem('ppal2:wantCal','1')}catch(e){}
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,scopes:CAL_SCOPE,
    queryParams:{prompt:'consent',include_granted_scopes:'true',login_hint:USER&&USER.email||''}}});
  if(error)toast('連結失敗：'+error.message);}
$('#btn-login').addEventListener('click',signIn);
$('#btn-demo').addEventListener('click',()=>{$('#login').hidden=true;startDemo()});
$('#demo-chip').addEventListener('click',()=>{$('#login').hidden=false});
function startDemo(){MODE='demo';$('#demo-chip').hidden=!!window.PIXELPAL_PREVIEW;settings();refreshAll();friends();$('#app').classList.remove('booting');}
async function startLive(session){MODE='live';$('#demo-chip').hidden=true;USER=session.user;ME=USER.id;$('#login').hidden=true;keepToken(session.provider_token);
  FRIENDS.length=0;Object.keys(MSGS).forEach(k=>delete MSGS[k]);st.unread={};st.liveEv=[];
  const p=await sb.from('profiles').select('*').eq('id',ME).single();
  if(p.error){toast('讀取個人資料失敗：'+p.error.message)}else{PROFILE=p.data;st.pet=PROFILE.pet;st.name=PROFILE.pet_name;st.time=String(PROFILE.remind_time).slice(0,5);
    save('pet',st.pet);save('name',st.name);save('time',st.time);$('#mycode').textContent=PROFILE.friend_code;
    const tz=(Intl.DateTimeFormat().resolvedOptions()||{}).timeZone;if(tz&&PROFILE.timezone!==tz)sb.from('profiles').update({timezone:tz}).eq('id',ME).then(()=>{PROFILE.timezone=tz});}
  settings();await Promise.all([loadEvents(),loadFriends()]);refreshAll();friends();subscribe();syncPush();
  $('#app').classList.remove('booting');
  let want=false;try{want=sessionStorage.getItem('ppal2:wantCal')==='1';sessionStorage.removeItem('ppal2:wantCal')}catch(e){}
  if(want)doSync(true,true);else if(gtoken()&&calLinked())doSync(false);}
async function boot(){
  header();applyScene();home();go('home');requestAnimationFrame(()=>setPose(pose()));if(!reduce)setInterval(frame,520);
  if(!sb){startDemo();return}
  const err=new URLSearchParams(location.search).get('error_description');if(err)toast('登入失敗：'+err);
  sb.auth.onAuthStateChange((ev,s)=>{if(s&&s.provider_token)keepToken(s.provider_token)});
  const {data:{session}}=await sb.auth.getSession();
  if(location.search.includes('code=')||location.hash.includes('access_token'))history.replaceState(null,'',location.pathname);
  if(session){await startLive(session);return}
  startDemo();$('#login').hidden=false;}
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
